name: SaaS delegation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saas-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: many_ci
          POSTGRES_PASSWORD: ci-only-dummy-password
          POSTGRES_DB: many_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U many_ci -d many_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://many_ci:ci-only-dummy-password@127.0.0.1:5432/many_test
      # Required by Settings; deliberately unreachable. Never used as a test target.
      DATABASE_URL: postgresql+psycopg://unused.invalid/many_test
      REDIS_URL: redis://127.0.0.1:6379/0
      META_APP_SECRET: ci-only-dummy-meta-secret
      META_WEBHOOK_VERIFY_TOKEN: ci-only-dummy-verify-token
      JWT_SECRET: ci-only-dummy-jwt-secret-at-least-thirty-two-bytes
      APP_SECRET_KEY: ci-only-dummy-app-secret-at-least-thirty-two-bytes
      TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      OPENAI_API_KEY: ""
      SENTRY_DSN: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - name: Run SaaS tests with local services only
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --system --create-home many-ci
          # Only the test user's egress is blocked; the Actions runner can report results.
          cleanup() {
            sudo iptables -D OUTPUT -m owner --uid-owner many-ci ! -d 127.0.0.0/8 -j REJECT
            sudo ip6tables -D OUTPUT -m owner --uid-owner many-ci -j REJECT
          }
          trap cleanup EXIT
          sudo iptables -I OUTPUT 1 -m owner --uid-owner many-ci ! -d 127.0.0.0/8 -j REJECT
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner many-ci -j REJECT
          sudo -E -u many-ci env "PATH=$PATH" bash --noprofile --norc <<'SH'
          set -euo pipefail
          test ! -e .env
          test ! -e backend/.env
          python - <<'PY'
          import os
          import sys
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          import redis

          url = make_url(os.environ["TEST_DATABASE_URL"])
          assert os.environ["APP_ENV"] == "test"
          assert url.host == "127.0.0.1" and url.database == "many_test"
          print(f"Test database host={url.host} db={url.database}", flush=True)
          with create_engine(url).connect() as connection:
              assert connection.execute(text("SELECT current_database()")).scalar_one() == "many_test"
          redis.Redis.from_url(os.environ["REDIS_URL"]).flushall()
          sys.path.insert(0, "backend")
          from tests.conftest import DB_AVAILABLE, TEST_DATABASE_URL
          assert DB_AVAILABLE and TEST_DATABASE_URL == os.environ["TEST_DATABASE_URL"]
          print("Disposable DB verified; Redis flushed; external test egress blocked.")
          PY
          pytest backend/tests/test_saas_*.py
          SH

  contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s scripts -p test_check_contract_copies.py -v
      - run: python scripts/check_contract_copies.py
