# PROD OVERLAY: WRITTEN ONLY, NEVER DEPLOYED. Use with the base file:
#   docker compose -f docker-compose.unified.yml -f docker-compose.unified.prod.yml --env-file <prod env> config
# Requires approval before any real use (docs/DEPLOY-OUTLINE.md).
#
# OPEN ITEMS that make this overlay NOT deployable yet (owner decisions):
#  1. TLS at the edge: nginx/unified.conf is plain HTTP on :80. Terminate TLS in front
#     (load balancer) or add a TLS server block in a follow-up. Nothing is published on :443 here.
#  2. Internal TLS: in production the allowlist policy still requires HTTPS for the listed
#     service names (parse_url require_https). The internal URLs stored in the channel rows
#     (http://saas-api:8000, http://many-api:8000) would be rejected. Production needs
#     https:// internal URLs (internal CA / service certificates) before delegation can be turned on.
#  3. Real domains, real secrets, backups and migration order: see docs/DEPLOY-OUTLINE.md.
name: unified

services:
  pg15:
    restart: unless-stopped
  pg17:
    restart: unless-stopped
  redis:
    restart: unless-stopped

  many-api:
    restart: unless-stopped
    environment:
      APP_ENV: production
  many-worker:
    restart: unless-stopped
    environment:
      APP_ENV: production
  many-beat:
    restart: unless-stopped
    environment:
      APP_ENV: production
  many-migrate:
    environment:
      APP_ENV: production

  many-dashboard:
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_API_URL: ${MANY_PUBLIC_URL:?set MANY_PUBLIC_URL to the public Many URL}
        NEXT_PUBLIC_APP_ENV: production

  saas-api:
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
  saas-worker:
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
  saas-migrate:
    environment:
      ENVIRONMENT: production
  saas-web:
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    environment:
      MANY_HOST: ${MANY_HOST:?set MANY_HOST}
      SAAS_WEB_HOST: ${SAAS_WEB_HOST:?set SAAS_WEB_HOST}
      SAAS_API_HOST: ${SAAS_API_HOST:?set SAAS_API_HOST}
    # Replaces the dev loopback list. Only nginx is ever published; TLS is open item 1.
    ports: !override
      - "80:80"
