# PROD OVERLAY: WRITTEN ONLY, NEVER DEPLOYED. Use with the base file:
#   docker compose -f docker-compose.unified.yml -f docker-compose.unified.prod.yml --env-file <prod env> config
# Requires approval before any real use (docs/DEPLOY-OUTLINE.md).
#
# Phase 6A (2026-11-28): the two TLS items that blocked this overlay are now written here, but
# NOTHING BELOW HAS RUN as containers (no Docker engine where it was written; `docker compose config`
# and `nginx -t` only). The first real run is the staging stack (Phase 6B).
#  1. Edge TLS: nginx publishes 80 (certificate challenge, redirect to HTTPS) and 443 with one
#     certificate named "edge" from Let's Encrypt (docs/staging/6A-edge-and-internal-tls.md).
#  2. Internal TLS: many-api and saas-api serve HTTPS on port 8000 with certificates from the private
#     CA (scripts/tls/make_internal_pki.sh). Every Python service trusts that CA plus the public roots
#     (SSL_CERT_FILE); nginx verifies the upstreams; the Next server trusts it too. The internal URLs
#     stored in channel rows must be written as https://many-api:8000 and https://saas-api:8000.
# Required host paths in the env file: PKI_DIR (output of make_internal_pki.sh), LETSENCRYPT_DIR
# (usually /etc/letsencrypt), CERTBOT_WEBROOT (for example /var/www/certbot).
x-trust: &trust
  SSL_CERT_FILE: /pki/ca-bundle.pem
  REQUESTS_CA_BUNDLE: /pki/ca-bundle.pem
  CURL_CA_BUNDLE: /pki/ca-bundle.pem
x-pki-mount: &pki-mount ${PKI_DIR:?set PKI_DIR to the internal PKI directory}:/pki:ro
name: unified

services:
  pg15:
    restart: unless-stopped
  pg17:
    restart: unless-stopped
  redis:
    restart: unless-stopped

  many-api:
    restart: unless-stopped
    environment:
      APP_ENV: production
      <<: *trust
    volumes: [*pki-mount]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--ssl-keyfile", "/pki/many-api.key", "--ssl-certfile", "/pki/many-api.pem"]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; c = ssl.create_default_context(cafile='/pki/ca.pem'); c.check_hostname = False; urllib.request.urlopen('https://127.0.0.1:8000/health', timeout=5, context=c)"]
  many-worker:
    restart: unless-stopped
    environment:
      APP_ENV: production
      <<: *trust
    volumes: [*pki-mount]
  many-beat:
    restart: unless-stopped
    environment:
      APP_ENV: production
      <<: *trust
    volumes: [*pki-mount]
  many-migrate:
    environment:
      APP_ENV: production

  many-dashboard:
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_API_URL: ${MANY_PUBLIC_URL:?set MANY_PUBLIC_URL to the public Many URL}
        NEXT_PUBLIC_APP_ENV: production

  saas-api:
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      MANY_API_BASE_URL: ${MANY_API_BASE_URL:-https://many-api:8000}
      <<: *trust
    volumes: [*pki-mount]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-keep-alive", "65", "--ssl-keyfile", "/pki/saas-api.key", "--ssl-certfile", "/pki/saas-api.pem"]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; c = ssl.create_default_context(cafile='/pki/ca.pem'); c.check_hostname = False; urllib.request.urlopen('https://127.0.0.1:8000/ready', timeout=5, context=c)"]
  saas-worker:
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      MANY_API_BASE_URL: ${MANY_API_BASE_URL:-https://many-api:8000}
      <<: *trust
    volumes: [*pki-mount]
  saas-migrate:
    environment:
      ENVIRONMENT: production
  saas-web:
    restart: unless-stopped
    build:
      args:
        API_PROXY_TARGET: https://saas-api:8000
    environment:
      API_PROXY_TARGET: https://saas-api:8000
      NODE_EXTRA_CA_CERTS: /pki/ca.pem
    volumes: [*pki-mount]

  nginx:
    restart: unless-stopped
    environment:
      MANY_HOST: ${MANY_HOST:?set MANY_HOST}
      SAAS_WEB_HOST: ${SAAS_WEB_HOST:?set SAAS_WEB_HOST}
      SAAS_API_HOST: ${SAAS_API_HOST:?set SAAS_API_HOST}
      UPSTREAM_SCHEME: https
    # Replaces the dev loopback list and the dev mounts. Only nginx is ever published.
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./nginx/unified.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/redirect.conf.template:/etc/nginx/templates/redirect.conf.template:ro
      - ./nginx/edge/https:/etc/nginx/edge:ro
      - ./nginx/upstream/tls:/etc/nginx/upstream:ro
      - *pki-mount
      - ${LETSENCRYPT_DIR:?set LETSENCRYPT_DIR}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:?set CERTBOT_WEBROOT}:/var/www/certbot:ro
