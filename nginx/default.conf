limit_req_zone $binary_remote_addr zone=meta_webhook:10m rate=10r/s;
# Shared across both signed SaaS URL prefixes, independent of Meta webhooks.
limit_req_zone $binary_remote_addr zone=saas_signed:10m rate=100r/s;

upstream backend_upstream {
    server backend:8000;
}

upstream dashboard_upstream {
    server dashboard:3000;
}

server {
    listen 80;
    server_name automation.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name automation.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/automation.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/automation.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /webhooks/meta {
        limit_req zone=meta_webhook burst=20 nodelay;
        proxy_pass http://backend_upstream/webhooks/meta;
    }

    # SaaS delegation (signed, machine-to-machine). The SaaS sends
    # `Accept-Encoding: identity` and the contract (A14) says Many must not
    # compress the 202 body, so gzip is off here (more specific prefixes win
    # over /api/ and /).
    location /api/saas/ {
        gzip off;
        limit_req zone=saas_signed burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_upstream/saas/;
    }

    location /saas/ {
        gzip off;
        limit_req zone=saas_signed burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_upstream/saas/;
    }

    location /api/ {
        proxy_pass http://backend_upstream/;
    }

    location /auth/ {
        proxy_pass http://backend_upstream/auth/;
    }

    location /meta/ {
        proxy_pass http://backend_upstream/meta/;
    }

    location /instagram/ {
        proxy_pass http://backend_upstream/instagram/;
    }

    location /campaigns/ {
        proxy_pass http://backend_upstream/campaigns/;
    }

    location /leads/ {
        proxy_pass http://backend_upstream/leads/;
    }

    location /messages/ {
        proxy_pass http://backend_upstream/messages/;
    }

    location /logs/ {
        proxy_pass http://backend_upstream/logs/;
    }

    location /stats/ {
        proxy_pass http://backend_upstream/stats/;
    }

    location = /health {
        proxy_pass http://backend_upstream/health;
    }

    location /webhooks/ {
        proxy_pass http://backend_upstream/webhooks/;
    }

    location / {
        proxy_pass http://dashboard_upstream;
    }
}
