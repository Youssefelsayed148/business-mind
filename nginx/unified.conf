# Unified edge for Many + SaaS (Phase 2b). nginx envsubst TEMPLATE: mount as
# /etc/nginx/templates/default.conf.template. Only ${MANY_HOST}, ${SAAS_WEB_HOST}
# and ${SAAS_API_HOST} are substituted; nginx variables ($host, ...) are untouched.
# nginx/default.conf is NOT edited; see docs/RUNBOOK-DEV.md for the differences.
#
# Plain HTTP on port 80 (dev and the e2e run). TLS is an open deployment decision
# (docs/DEPLOY-OUTLINE.md); nothing here is deployed.
#
# Security rule: signed machine-to-machine endpoints never leave the internal
# network. They are denied with ^~ prefix locations (which win over regex and
# over the shorter /api/ prefixes) on EVERY host that can reach the service:
#   - Many  /api/saas/*, /saas/*              (HMAC-signed; SaaS reaches them as http://many-api:8000)
#   - SaaS  /api/channels/* (the signed events endpoint /api/channels/manyosiris/events;
#           the SaaS admin API lives under /api/v1/ and is unaffected), on BOTH the
#           SaaS web host (Next rewrites /api/* to saas-api) and the SaaS API host.
# nginx matches on the decoded, slash-merged, dot-segment-normalized URI, so
# //x, %73, /../ spellings land on the same deny locations (verified by
# e2e/phase2/check_nginx.py).

limit_req_zone $binary_remote_addr zone=meta_webhook:10m rate=10r/s;
# SSO assertion exchange (Phase 3, design 2.6): 30 requests a minute per client address, burst 10.
limit_req_zone $binary_remote_addr zone=sso_exchange:10m rate=30r/m;

upstream many_backend {
    server many-api:8000;
}

upstream many_dashboard {
    server many-dashboard:3000;
}

upstream saas_api {
    server saas-api:8000;
}

upstream saas_web {
    server saas-web:3000;
}

# ---------------------------------------------------------------- Many (default host)
server {
    listen 80 default_server;
    server_name ${MANY_HOST};

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Signed service-to-service routes: internal only (default.conf lines 64 and 71 are
    # public there; deliberately not here).
    location = /api/saas { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location ^~ /api/saas/ { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location = /saas { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location ^~ /saas/ { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    # Case-insensitive twin: nginx prefix locations are case-sensitive but upstream routers
    # may not be (Next rewrites). Regex locations lose to ^~, so the lowercase forms keep
    # their ^~ match; /API/saas/... lands here. Only /api/saas is covered, not /saas pages.
    location ~* ^/api/saas(/|$) { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }

    # Routes below are copied unchanged from default.conf (only the upstream names differ).
    location = /webhooks/meta {
        limit_req zone=meta_webhook burst=20 nodelay;
        proxy_pass http://many_backend/webhooks/meta;
    }

    location /api/ {
        proxy_pass http://many_backend/;
    }

    # SSO assertion exchange (design 2.6, D3 option a): deliberately public on the Many host only,
    # rate limited here. The exact match covers the normal spelling (nginx decodes %XX and merges
    # slashes and dot segments first). The case-insensitive regex twin covers spellings the exact
    # match misses (mixed case, trailing slash) so that none of them can be used to dodge the
    # limit; they are forwarded as written and the app answers them (404 or the slash redirect).
    # The regex wins over the plain /auth/ prefix below. The SaaS hosts have no such location:
    # the path is not routed to Many there.
    location = /auth/sso/exchange {
        limit_req zone=sso_exchange burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://many_backend/auth/sso/exchange;
    }
    location ~* ^/auth/sso/exchange/?$ {
        limit_req zone=sso_exchange burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://many_backend;
    }

    # The /api/ prefix above strips itself, so these spellings reach the same handler and get
    # the same limit. The regex wins over the plain /api/ prefix.
    location = /api/auth/sso/exchange {
        limit_req zone=sso_exchange burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://many_backend/auth/sso/exchange;
    }
    location ~* ^/api/(?<sso_path>auth/sso/exchange/?)$ {
        limit_req zone=sso_exchange burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://many_backend/$sso_path$is_args$args;
    }

    location /auth/ {
        proxy_pass http://many_backend/auth/;
    }

    location /meta/ {
        proxy_pass http://many_backend/meta/;
    }

    location /instagram/ {
        proxy_pass http://many_backend/instagram/;
    }

    location /campaigns/ {
        proxy_pass http://many_backend/campaigns/;
    }

    location /leads/ {
        proxy_pass http://many_backend/leads/;
    }

    location /messages/ {
        proxy_pass http://many_backend/messages/;
    }

    location /logs/ {
        proxy_pass http://many_backend/logs/;
    }

    location /stats/ {
        proxy_pass http://many_backend/stats/;
    }

    location = /health {
        proxy_pass http://many_backend/health;
    }

    location /webhooks/ {
        proxy_pass http://many_backend/webhooks/;
    }

    location / {
        proxy_pass http://many_dashboard;
    }
}

# ---------------------------------------------------------------- SaaS web dashboard
server {
    listen 80;
    server_name ${SAAS_WEB_HOST};

    client_max_body_size 520m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the SaaS API scopes rate limits by the first value (as the
    # SaaS Caddyfile does). A proxy added in front of nginx needs real_ip configuration.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Next.js rewrites /api/:path* to saas-api, so the signed events endpoint is
    # reachable through this host unless denied here.
    location = /api/channels { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location ^~ /api/channels/ { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    # Case-insensitive twin (Next rewrites match /API/channels/... and forward it to saas-api).
    location ~* ^/api/channels(/|$) { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }

    location / {
        proxy_pass http://saas_web;
    }
}

# ---------------------------------------------------------------- SaaS API (direct host)
server {
    listen 80;
    server_name ${SAAS_API_HOST};

    client_max_body_size 520m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the SaaS API scopes rate limits by the first value (as the
    # SaaS Caddyfile does). A proxy added in front of nginx needs real_ip configuration.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /api/channels { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location ^~ /api/channels/ { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    # Case-insensitive twin (Next rewrites match /API/channels/... and forward it to saas-api).
    location ~* ^/api/channels(/|$) { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }

    location / {
        proxy_pass http://saas_api;
    }
}
