# Unified edge for Many + SaaS (Phase 2b). nginx envsubst TEMPLATE: mount as
# /etc/nginx/templates/default.conf.template. Only ${MANY_HOST}, ${SAAS_WEB_HOST},
# ${SAAS_API_HOST} and ${UPSTREAM_SCHEME} are substituted; nginx variables ($host, ...) are untouched.
# nginx/default.conf is NOT edited; see docs/RUNBOOK-DEV.md for the differences.
#
# Listening and upstream TLS are chosen by what is mounted, not by editing this file:
#   /etc/nginx/edge/listen-{many,web,api}.conf   nginx/edge/http  (dev, port 80)  or nginx/edge/https (port 443 + certificate)
#   /etc/nginx/upstream/upstream-tls.conf        nginx/upstream/plain (nothing) or nginx/upstream/tls (verify the private CA)
# and by ${UPSTREAM_SCHEME} (http or https) for the two API upstreams. The deny rules below are the
# same in every mode. Dev and the e2e run use the http and plain sets. docs/staging/6A-edge-and-internal-tls.md.
#
# Security rule: signed machine-to-machine endpoints never leave the internal
# network. They are denied with ^~ prefix locations (which win over regex and
# over the shorter /api/ prefixes) on EVERY host that can reach the service:
#   - Many  /api/saas/*, /saas/*              (HMAC-signed; SaaS reaches them as http://many-api:8000)
#   - SaaS  /api/channels/* (the signed events endpoint /api/channels/manyosiris/events;
#           the SaaS admin API lives under /api/v1/ and is unaffected), on BOTH the
#           SaaS web host (Next rewrites /api/* to saas-api) and the SaaS API host.
# nginx matches on the decoded, slash-merged, dot-segment-normalized URI, so
# //x, %73, /../ spellings land on the same deny locations (verified by
# e2e/phase2/check_nginx.py).

limit_req_zone $binary_remote_addr zone=meta_webhook:10m rate=10r/s;

upstream many_backend {
    server many-api:8000;
}

upstream many_dashboard {
    server many-dashboard:3000;
}

upstream saas_api {
    server saas-api:8000;
}

upstream saas_web {
    server saas-web:3000;
}

# ---------------------------------------------------------------- Many (default host)
server {
    include /etc/nginx/edge/listen-many.conf;
    server_name ${MANY_HOST};
    include /etc/nginx/upstream/upstream-tls.conf;
    proxy_ssl_name many-api;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Signed service-to-service routes: internal only (default.conf lines 64 and 71 are
    # public there; deliberately not here).
    location = /api/saas { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location ^~ /api/saas/ { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location = /saas { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location ^~ /saas/ { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    # Case-insensitive twin: nginx prefix locations are case-sensitive but upstream routers
    # may not be (Next rewrites). Regex locations lose to ^~, so the lowercase forms keep
    # their ^~ match; /API/saas/... lands here. Only /api/saas is covered, not /saas pages.
    location ~* ^/api/saas(/|$) { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }

    # Routes below are copied unchanged from default.conf (only the upstream names differ).
    location = /webhooks/meta {
        limit_req zone=meta_webhook burst=20 nodelay;
        proxy_pass ${UPSTREAM_SCHEME}://many_backend/webhooks/meta;
    }

    location /api/ {
        proxy_pass ${UPSTREAM_SCHEME}://many_backend/;
    }

    # SSO assertion exchange (design 2.6, D3 option b; Phase 4F): internal only. The SaaS API
    # exchanges server-side as http://many-api:8000/auth/sso/exchange, so the browser never needs
    # it and it is denied here in every spelling. The exact locations cover the normal spellings
    # (nginx decodes %XX and merges slashes and dot segments first); the case-insensitive regex
    # twins cover mixed case and a trailing slash. The deny wins over the plain /auth/ and /api/
    # prefixes below. The SaaS hosts have no such location: the path is not routed to Many there.
    # Rollback: restore the previous unified.conf (public location with the sso_exchange limit).
    location = /auth/sso/exchange { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location ~* ^/auth/sso/exchange/?$ { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location = /api/auth/sso/exchange { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location ~* ^/api/auth/sso/exchange/?$ { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }

    location /auth/ {
        proxy_pass ${UPSTREAM_SCHEME}://many_backend/auth/;
    }

    location /meta/ {
        proxy_pass ${UPSTREAM_SCHEME}://many_backend/meta/;
    }

    location /instagram/ {
        proxy_pass ${UPSTREAM_SCHEME}://many_backend/instagram/;
    }

    location /campaigns/ {
        proxy_pass ${UPSTREAM_SCHEME}://many_backend/campaigns/;
    }

    location /leads/ {
        proxy_pass ${UPSTREAM_SCHEME}://many_backend/leads/;
    }

    location /messages/ {
        proxy_pass ${UPSTREAM_SCHEME}://many_backend/messages/;
    }

    location /logs/ {
        proxy_pass ${UPSTREAM_SCHEME}://many_backend/logs/;
    }

    location /stats/ {
        proxy_pass ${UPSTREAM_SCHEME}://many_backend/stats/;
    }

    location = /health {
        proxy_pass ${UPSTREAM_SCHEME}://many_backend/health;
    }

    location /webhooks/ {
        proxy_pass ${UPSTREAM_SCHEME}://many_backend/webhooks/;
    }

    location / {
        proxy_pass http://many_dashboard;
    }
}

# ---------------------------------------------------------------- SaaS web dashboard
server {
    include /etc/nginx/edge/listen-web.conf;
    server_name ${SAAS_WEB_HOST};
    include /etc/nginx/upstream/upstream-tls.conf;
    proxy_ssl_name saas-api;

    client_max_body_size 520m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the SaaS API scopes rate limits by the first value (as the
    # SaaS Caddyfile does). A proxy added in front of nginx needs real_ip configuration.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Next.js rewrites /api/:path* to saas-api, so the signed events endpoint is
    # reachable through this host unless denied here.
    location = /api/channels { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location ^~ /api/channels/ { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    # Case-insensitive twin (Next rewrites match /API/channels/... and forward it to saas-api).
    location ~* ^/api/channels(/|$) { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }

    location / {
        proxy_pass http://saas_web;
    }
}

# ---------------------------------------------------------------- SaaS API (direct host)
server {
    include /etc/nginx/edge/listen-api.conf;
    server_name ${SAAS_API_HOST};
    include /etc/nginx/upstream/upstream-tls.conf;
    proxy_ssl_name saas-api;

    client_max_body_size 520m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the SaaS API scopes rate limits by the first value (as the
    # SaaS Caddyfile does). A proxy added in front of nginx needs real_ip configuration.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /api/channels { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    location ^~ /api/channels/ { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }
    # Case-insensitive twin (Next rewrites match /API/channels/... and forward it to saas-api).
    location ~* ^/api/channels(/|$) { add_header X-Edge-Deny 1 always; default_type text/plain; return 403 "denied at the edge
"; }

    location / {
        proxy_pass ${UPSTREAM_SCHEME}://saas_api;
    }
}
