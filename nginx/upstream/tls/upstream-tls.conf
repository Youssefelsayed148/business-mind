# HTTPS to many-api and saas-api, verified against the private CA (scripts/tls/make_internal_pki.sh).
# proxy_ssl_name is set in each server block of unified.conf.
proxy_ssl_server_name on;
proxy_ssl_trusted_certificate /pki/ca.pem;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
